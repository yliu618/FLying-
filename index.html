<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vertical Shooter Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; }
        .game-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
        #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 48px;
            text-align: center;
            display: none; /* Hidden by default */
        }
        #restart-button {
            font-size: 24px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="lives" class="game-info">❤️❤️❤️</div>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="1080" height="1920"></canvas>
    <div id="game-over-screen">
        <div>Game Over</div>
        <div id="final-score"></div>
        <button id="restart-button">Restart</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
